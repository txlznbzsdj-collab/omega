[package]
name = "omega"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Arbitrary-precision calculator: integers of unbounded size, exact rationals, and high-precision reals."
license = "MIT"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Benchmark harness comparing omega against Python and C++ baselines.
# Build with: cargo build --release --bin compare
[[bin]]
name = "compare"
path = "bench/compare.rs"
