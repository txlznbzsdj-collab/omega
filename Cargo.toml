[package]
name = "omega"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Arbitrary-precision calculator: integers of unbounded size, exact rationals, and high-precision reals."
license = "MIT"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

# Only the native window needs to link anything, and on Windows the Win32
# libraries are already part of the OS, so the front end adds no runtime
# dependency.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Benchmark harness comparing omega against Python and C++ baselines.
# Build with: cargo build --release --bin compare
[[bin]]
name = "compare"
path = "bench/compare.rs"

# The graphical front end. Same engine, native window, no toolkit.
[[bin]]
name = "omega-gui"
path = "src/bin/omega-gui.rs"
# Measures the real text capacity of a Win32 edit control, so result display is
# sized against evidence rather than a guess.
[[bin]]
name = "edit-limit-probe"
path = "bench/edit-limit-probe.rs"
# Enumerates a running window's controls, so the keypad and menu can be
# confirmed without being able to see or click them.
[[bin]]
name = "gui-inspect"
path = "bench/gui-inspect.rs"
# Reports a running window's keypad geometry, so the layout can be checked
# against what it should be without seeing the screen.
[[bin]]
name = "gui-geometry"
path = "bench/gui-geometry.rs"